name: Publish Docker image

on:
  push:
    branches: ['main', 'develop']

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump patch version
        id: version
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Bumped to v$NEW_VERSION"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to v${{ env.VERSION }} [skip ci]"
          git push

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo name
        run: echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set Tag Name
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO }}:${{ env.VERSION }}-${{ github.ref_name }}

      - name: Notify Backend of Update
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            WEBHOOK_URL="https://api.digitalsuite.tech/api/v1/webhooks/app-update"
          else
            WEBHOOK_URL="https://dev-api.digitalsuite.tech/api/v1/webhooks/app-update"
          fi
          
          curl -X POST $WEBHOOK_URL \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.APP_UPDATE_API_KEY }}" \
            -d "{\"template_type\":\"social_media_scheduler\", \"version\":\"${{ env.VERSION }}\"}" \
            --fail --silent --show-error || echo "Webhook notification failed, but continuing pipeline."
